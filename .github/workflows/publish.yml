name: Publish SmartTravel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish.yml'
      - 'release/SmartTravel.zip'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved release package
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('release/SmartTravel.zip') as archive:
              expected = {'SmartTravel/SmartTravel.lua', 'SmartTravel/SmartTravel.toc', 'SmartTravel/README.md', 'SmartTravel/SmartTravel-Cover.jpg'}
              assert set(archive.namelist()) == expected
              for name in ('SmartTravel.lua', 'SmartTravel.toc', 'SmartTravel-Cover.jpg'):
                  assert archive.read('SmartTravel/' + name) == pathlib.Path(name).read_bytes()
              assert b'## Version: 1.0.0' in archive.read('SmartTravel/SmartTravel.toc')
          PY
      - name: Update existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0
          gh release upload v1.0.0 release/SmartTravel.zip --clobber
