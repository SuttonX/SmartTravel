name: Publish SmartTravel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          mkdir -p dist/SmartTravel
          cp SmartTravel.lua SmartTravel.toc dist/SmartTravel/
          cp README.md dist/SmartTravel/
          cp SmartTravel-Cover.svg dist/SmartTravel/
          cd dist && zip -r SmartTravel.zip SmartTravel
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 dist/SmartTravel.zip --title 'SmartTravel v1.0.0' --notes 'Initial public release for WoW WotLK 3.3.5a. Smart mount selection, Druid travel forms, Shaman Ghost Wolf, configurable Hearthstone modifier and mount overrides.'
          gh release upload v1.0.0 dist/SmartTravel.zip --clobber
